name: Publish Phaser beta alongside legacy Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-phaser-beta.yml']
  workflow_run:
    workflows: ['Ironwood Phaser preview']
    types: [completed]
    branches: ['feat/phaser-retry-endings-m4b']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ironwood-pages-beta-publish
  cancel-in-progress: false

jobs:
  publish-beta:
    # Only an approved immutable candidate CI may publish. A failed, cancelled
    # or newer unreviewed source run cannot overwrite the current beta.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id == 38988894146 && github.event.workflow_run.head_sha == '74b0c1542880a62c12814cd19243e99899f82dcc' && github.event.workflow_run.head_repository.full_name == 'pedromaintenance/ironwood-a-ultima-resistencia') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Pages source (legacy Canvas stays untouched)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Require completed green CI for the exact M4b candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api repos/${{ github.repository }}/actions/runs/38988894146 --jq '.conclusion')"
          test "$conclusion" = success
      - name: Checkout tested Phaser preview independently
        uses: actions/checkout@v4
        with:
          # Immutable, CI-verified M4b release candidate.
          # tests/build/browser: https://github.com/pedromaintenance/ironwood-a-ultima-resistencia/actions/runs/38988894146
          ref: 74b0c1542880a62c12814cd19243e99899f82dcc
          path: .phaser-build-src
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exactly the commit tested in CI
        run: |
          test "$(git -C .phaser-build-src rev-parse HEAD)" = "74b0c1542880a62c12814cd19243e99899f82dcc"
      - name: Verify core regressions
        run: npm test
        working-directory: .phaser-build-src
      - name: Build separate Phaser preview
        working-directory: .phaser-build-src/phaser
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Copy build to own Pages subdirectory only
        run: |
          mkdir -p phaser-preview
          rm -rf phaser-preview/assets
          cp -R .phaser-build-src/phaser/dist/. phaser-preview/
          test -s phaser-preview/index.html
          test -f index.html
          test -f sw.js
          printf '%s\n' 'Phaser M4b beta: 74b0c1542880a62c12814cd19243e99899f82dcc (CI 38988894146). Canvas main root retained.' > phaser-preview/DEPLOYMENT.txt
      - name: Commit the generated standalone preview to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f phaser-preview
          if git diff --cached --quiet; then
            echo 'Published preview is already up to date.'
            exit 0
          fi
          git commit -m 'build(pages): publish tested M4b beta under phaser-preview'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Note preview path
        run: |
          echo 'Preview: https://pedromaintenance.github.io/ironwood-a-ultima-resistencia/phaser-preview/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Legacy: https://pedromaintenance.github.io/ironwood-a-ultima-resistencia/' >> "$GITHUB_STEP_SUMMARY"
