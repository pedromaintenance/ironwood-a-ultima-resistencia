name: Ironwood M4f portable AI and three missions

on:
  push:
    branches: [feat/phaser-portable-ai-m4f]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve legacy rules and all core regressions
        run: npm test
      - name: Test portable AI and legacy save compatibility
        run: node --test tests/portable-order.test.mjs
      - name: Validate natural campaign victories 1-3 with portable ordering
        run: node --test tests/playthrough.test.mjs tests/rescue.test.mjs tests/totem.test.mjs
