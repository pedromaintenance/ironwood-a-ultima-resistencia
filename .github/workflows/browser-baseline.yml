name: Ironwood browser baseline
on:
  push:
    branches:
      - feat/phaser-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve legacy app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ironwood-http.log 2>&1 &
      - name: Execute smoke scenario
        run: node tests/browser-smoke.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-mobile-evidence
          path: artifacts/baseline/
          if-no-files-found: warn
