name: Ironwood Phaser preview
on:
  push:
    branches:
      - feat/phaser-battle-preview
      - feat/phaser-pixel-art-m2
      - feat/phaser-combat-ux-m3
      - feat/phaser-impact-preview-m3b
      - feat/phaser-unit-pooling-m3c
      - feat/phaser-command-lock-m3d
      - feat/phaser-hud-feedback-m3e
  pull_request:
    branches:
      - feat/ironwood-core-phase1
      - feat/phaser-battle-preview
  workflow_dispatch:


# New push cancels stale jobs from the same preview branch; the last commit wins.
concurrency:
  group: phaser-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phaser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test legacy/core parity before rendering
        working-directory: .
        run: npm test
      - name: Install Phaser, Vite and TypeScript
        run: npm install --no-audit --no-fund
      - name: Build independent Phaser preview
        run: npm run build
      - name: Archive preview
        uses: actions/upload-artifact@v4
        with:
          name: ironwood-phaser-preview
          path: phaser/dist/
          if-no-files-found: error
      - name: Install Chromium for browser smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Launch Phaser preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ironwood-phaser.log 2>&1 &
      - name: Test actual Phaser browser interactions
        run: node tests/smoke.mjs
      - name: Archive UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironwood-phaser-screenshots
          path: phaser/artifacts/preview/
          if-no-files-found: warn
